name: Python dependency audit
on:
  push:
    branches: [work/security-local-coding-alpha]
  pull_request:
    paths:
      - 'pyproject.toml'
      - '.github/workflows/python-dependency-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency tools
        run: python -m pip install --disable-pip-version-check pip-tools pip-audit
      - name: Resolve project dependencies without installing runtime packages
        run: python -m piptools compile pyproject.toml --output-file resolved-requirements.txt --quiet
      - name: Audit resolved dependencies (advisory)
        run: |
          python -m pip_audit --no-deps --progress-spinner off --format json --output dependency-audit.json -r resolved-requirements.txt
      - name: Upload dependency report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-dependency-audit-report
          path: dependency-audit.json
          if-no-files-found: warn
