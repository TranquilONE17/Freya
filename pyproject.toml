[project]
name = "freya"
version = "0.1.0"
description = "Local-first, modular, multi-user agentic AI platform."
readme = "README.md"
# kokoro (via misaki) does not support Python 3.13 yet.
requires-python = ">=3.12,<3.13"
dependencies = [
    "faster-whisper>=1.2",
    "flet>=1.0.3",
    "kokoro>=0.9.4",
    "numpy>=2.0",
    "ollama>=0.6",
    "psutil>=7",
    "sounddevice>=0.5",
    "soundfile>=0.13",
    "websockets>=15",
]

[dependency-groups]
dev = [
    "flet-cli>=1.0.3",
    "flet-desktop>=1.0.3",
    "flet-web>=1.0.3",
    "flet[test]>=1.0.3",
    "pytest>=8",
]

[project.scripts]
freya = "freya.main:main"

# Starts Freya with her window only, without a console window.
[project.gui-scripts]
freya-window = "freya.launcher:main_window"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"freya.image" = ["workflows/*.json"]
"freya.spatial_avatar" = ["blender/*.py"]
"freya.gateway" = [
    "static/*",
    "static/vendor/*",
    "static/vendor/three/*",
    "static/vendor/three/addons/*/*",
    "static/vendor/three-vrm/*",
]

# voice/stt_test.py and voice/tts_test.py are manual scripts, so only collect
# from tests/.
[tool.pytest.ini_options]
testpaths = ["tests"]
