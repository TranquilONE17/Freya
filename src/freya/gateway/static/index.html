<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Freya</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="bar">
    <h1 class="brand">Freya</h1>

    <nav class="tabs" role="tablist">
      <button class="tab is-active" role="tab" id="tab-chat" aria-selected="true" aria-controls="view-chat" data-view="chat">Chat</button>
      <button class="tab" role="tab" id="tab-images" aria-selected="false" aria-controls="view-images" data-view="images">Images <span class="badge" id="images-badge" hidden></span></button>
    </nav>

    <div class="status" id="status" aria-live="polite">
      <span class="pill" id="pill-model" title="Language model">Model</span>
      <span class="pill" id="pill-images" title="Image generation">Images</span>
      <button class="pill pill-button" id="pill-mic" title="Turn the microphone on or off">Microphone</button>
    </div>
  </header>

  <div class="banner" id="banner" hidden>Not connected to Freya. Trying again…</div>

  <main>
    <section class="view is-active" id="view-chat" role="tabpanel" aria-labelledby="tab-chat">
      <div class="messages" id="messages" aria-live="polite">
        <p class="empty" id="chat-empty">Say her name, or type below.</p>
      </div>

      <form class="composer" id="chat-form">
        <textarea id="chat-input" rows="1" placeholder="Message Freya" aria-label="Message Freya" maxlength="4000"></textarea>
        <button type="button" class="ghost" id="stop-speaking" title="Stop her speaking">Stop voice</button>
        <button type="submit" class="primary">Send</button>
      </form>
    </section>

    <section class="view" id="view-images" role="tabpanel" aria-labelledby="tab-images">
      <form class="composer" id="image-form">
        <textarea id="image-input" rows="1" placeholder="Describe an image to generate" aria-label="Describe an image to generate" maxlength="2000"></textarea>
        <button type="submit" class="primary">Generate</button>
      </form>

      <p class="working" id="image-working" hidden></p>

      <div class="gallery" id="gallery">
        <p class="empty" id="gallery-empty">Images Freya generates will appear here.</p>
      </div>
    </section>
  </main>

  <div class="lightbox" id="lightbox" hidden>
    <figure>
      <img id="lightbox-image" alt="">
      <figcaption id="lightbox-caption"></figcaption>
    </figure>
  </div>

  <script src="/app.js"></script>
</body>
</html>
